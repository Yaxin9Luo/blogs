<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">From effective agents to long-horizon harnesses</title>
  <desc id="desc">A sanitized diagram showing how simple LLM calls, workflows, agents, and long-horizon harnesses form a complexity ladder for artifact-producing systems.</desc>
  <rect width="1200" height="680" fill="#f7faf8"/>
  <rect x="54" y="44" width="1092" height="592" rx="22" fill="#ffffff" stroke="#cbd8d5" stroke-width="2"/>
  <text x="88" y="98" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#14302b">From Effective Agents to Long-Horizon Harnesses</text>
  <text x="88" y="132" font-family="Inter, Arial, sans-serif" font-size="16" fill="#536460">Add autonomy only when the task needs open-ended decisions, durable state, and verifiable artifacts.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#354f4a"/>
    </marker>
  </defs>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="92" y="222" width="184" height="170" rx="16" fill="#e8f5f1" stroke="#168064" stroke-width="2"/>
    <text x="184" y="260" text-anchor="middle" font-size="19" font-weight="700" fill="#0b4c40">Single Call</text>
    <text x="184" y="294" text-anchor="middle" font-size="13" fill="#31524b">prompt</text>
    <text x="184" y="320" text-anchor="middle" font-size="13" fill="#31524b">retrieval</text>
    <text x="184" y="346" text-anchor="middle" font-size="13" fill="#31524b">examples</text>

    <rect x="342" y="222" width="184" height="170" rx="16" fill="#fff5e8" stroke="#c8712c" stroke-width="2"/>
    <text x="434" y="260" text-anchor="middle" font-size="19" font-weight="700" fill="#7b3f13">Workflow</text>
    <text x="434" y="294" text-anchor="middle" font-size="13" fill="#6d543f">chain</text>
    <text x="434" y="320" text-anchor="middle" font-size="13" fill="#6d543f">route</text>
    <text x="434" y="346" text-anchor="middle" font-size="13" fill="#6d543f">parallel check</text>

    <rect x="592" y="222" width="184" height="170" rx="16" fill="#edf2ff" stroke="#5278d6" stroke-width="2"/>
    <text x="684" y="260" text-anchor="middle" font-size="19" font-weight="700" fill="#213f8b">Agent</text>
    <text x="684" y="294" text-anchor="middle" font-size="13" fill="#405078">plan</text>
    <text x="684" y="320" text-anchor="middle" font-size="13" fill="#405078">use tools</text>
    <text x="684" y="346" text-anchor="middle" font-size="13" fill="#405078">recover</text>

    <rect x="842" y="192" width="250" height="230" rx="18" fill="#f1edf8" stroke="#8467b8" stroke-width="2"/>
    <text x="967" y="232" text-anchor="middle" font-size="20" font-weight="700" fill="#513c7e">Harness</text>
    <rect x="880" y="264" width="174" height="32" rx="10" fill="#ffffff" stroke="#d6cbe8"/>
    <text x="967" y="285" text-anchor="middle" font-size="13" fill="#5f536f">source state</text>
    <rect x="880" y="310" width="174" height="32" rx="10" fill="#ffffff" stroke="#d6cbe8"/>
    <text x="967" y="331" text-anchor="middle" font-size="13" fill="#5f536f">artifact contract</text>
    <rect x="880" y="356" width="174" height="32" rx="10" fill="#ffffff" stroke="#d6cbe8"/>
    <text x="967" y="377" text-anchor="middle" font-size="13" fill="#5f536f">rendered verifier</text>

    <path d="M276 307 H342" stroke="#354f4a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M526 307 H592" stroke="#354f4a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M776 307 H842" stroke="#354f4a" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="176" y="492" width="848" height="74" rx="14" fill="#f8fbfa" stroke="#cbd8d5"/>
    <text x="600" y="524" text-anchor="middle" font-size="16" font-weight="700" fill="#14302b">Complexity should buy measurable control</text>
    <text x="600" y="550" text-anchor="middle" font-size="13" fill="#52625f">For Paper2Any, the control surface is not chat autonomy. It is source grounding, render checks, repair routes, and clean handoff.</text>
  </g>
</svg>
