<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Source pack compiler</title>
  <desc id="desc">A sanitized diagram showing how paper sections are compiled into mutually exclusive source packs before being allocated to artifact contracts and regression checks.</desc>
  <rect width="1200" height="660" fill="#f8fbfa"/>
  <rect x="54" y="54" width="1092" height="544" rx="20" fill="#ffffff" stroke="#cbd8d5" stroke-width="2"/>
  <text x="86" y="106" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#14302b">Compile Before You Generate</text>
  <text x="86" y="140" font-family="Inter, Arial, sans-serif" font-size="16" fill="#52625f">A long-horizon artifact system needs source packs that prevent duplicate claims and ungrounded filling.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#3a514d"/>
    </marker>
  </defs>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="96" y="230" width="180" height="84" rx="14" fill="#e8f5f1" stroke="#168064" stroke-width="2"/>
    <text x="186" y="264" text-anchor="middle" font-size="17" font-weight="700" fill="#0b4c40">Paper Sections</text>
    <text x="186" y="290" text-anchor="middle" font-size="13" fill="#31524b">intro / method / results</text>

    <rect x="364" y="230" width="190" height="84" rx="14" fill="#fff5e8" stroke="#c8712c" stroke-width="2"/>
    <text x="459" y="264" text-anchor="middle" font-size="17" font-weight="700" fill="#7b3f13">Content Compiler</text>
    <text x="459" y="290" text-anchor="middle" font-size="13" fill="#6d543f">split, dedupe, ground</text>

    <rect x="642" y="230" width="218" height="84" rx="14" fill="#edf2ff" stroke="#5278d6" stroke-width="2"/>
    <text x="751" y="264" text-anchor="middle" font-size="17" font-weight="700" fill="#213f8b">Source Packs</text>
    <text x="751" y="290" text-anchor="middle" font-size="13" fill="#405078">mutually exclusive evidence</text>

    <rect x="948" y="230" width="156" height="84" rx="14" fill="#f1edf8" stroke="#8467b8" stroke-width="2"/>
    <text x="1026" y="264" text-anchor="middle" font-size="17" font-weight="700" fill="#513c7e">Contracts</text>
    <text x="1026" y="290" text-anchor="middle" font-size="13" fill="#5f536f">artifact slots</text>

    <path d="M276 272 H364" stroke="#3a514d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M554 272 H642" stroke="#3a514d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M860 272 H948" stroke="#3a514d" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="112" y="406" width="202" height="78" rx="14" fill="#fbfdfc" stroke="#b9dcd2"/>
    <text x="213" y="436" text-anchor="middle" font-size="15" font-weight="700" fill="#14302b">Problem Pack</text>
    <text x="213" y="462" text-anchor="middle" font-size="12" fill="#52625f">motivation, gap, stakes</text>

    <rect x="364" y="406" width="202" height="78" rx="14" fill="#fbfdfc" stroke="#e1c2a5"/>
    <text x="465" y="436" text-anchor="middle" font-size="15" font-weight="700" fill="#14302b">Method Pack</text>
    <text x="465" y="462" text-anchor="middle" font-size="12" fill="#52625f">modules, flow, assumptions</text>

    <rect x="616" y="406" width="202" height="78" rx="14" fill="#fbfdfc" stroke="#c9d6fa"/>
    <text x="717" y="436" text-anchor="middle" font-size="15" font-weight="700" fill="#14302b">Experiment Pack</text>
    <text x="717" y="462" text-anchor="middle" font-size="12" fill="#52625f">metrics, tables, figures</text>

    <rect x="868" y="406" width="202" height="78" rx="14" fill="#fbfdfc" stroke="#d0c4e8"/>
    <text x="969" y="436" text-anchor="middle" font-size="15" font-weight="700" fill="#14302b">Limitation Pack</text>
    <text x="969" y="462" text-anchor="middle" font-size="12" fill="#52625f">risks, boundaries, next steps</text>

    <rect x="396" y="534" width="408" height="38" rx="19" fill="#e8f5f1" stroke="#b9dcd2"/>
    <text x="600" y="558" text-anchor="middle" font-size="14" fill="#31524b">Regression Checks: no duplicate claims, grounded text, required evidence</text>
  </g>
</svg>
