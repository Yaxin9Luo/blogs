<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Design harness positioning</title>
  <desc id="desc">A sanitized positioning diagram contrasting task-specific design pipelines with a horizontal design-domain harness for multiple artifact types.</desc>
  <rect width="1200" height="680" fill="#f8fbfa"/>
  <rect x="54" y="48" width="1092" height="584" rx="22" fill="#ffffff" stroke="#cbd8d5" stroke-width="2"/>
  <text x="86" y="102" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#14302b">Not One Design Agent, A Design-Domain Harness</text>
  <text x="86" y="136" font-family="Inter, Arial, sans-serif" font-size="16" fill="#52625f">The research object is the reusable workbench that lets agents build, inspect, repair, and export artifacts.</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="88" y="192" width="302" height="326" rx="18" fill="#f8fbfa" stroke="#cbd8d5" stroke-width="2"/>
    <text x="239" y="232" text-anchor="middle" font-size="20" font-weight="700" fill="#354f4a">Vertical Pipelines</text>
    <rect x="126" y="272" width="226" height="42" rx="12" fill="#e8f5f1" stroke="#168064"/>
    <text x="239" y="298" text-anchor="middle" font-size="14" fill="#0b4c40">paper to poster</text>
    <rect x="126" y="334" width="226" height="42" rx="12" fill="#fff5e8" stroke="#c8712c"/>
    <text x="239" y="360" text-anchor="middle" font-size="14" fill="#7b3f13">paper to slides</text>
    <rect x="126" y="396" width="226" height="42" rx="12" fill="#edf2ff" stroke="#5278d6"/>
    <text x="239" y="422" text-anchor="middle" font-size="14" fill="#213f8b">paper to web page</text>
    <text x="239" y="478" text-anchor="middle" font-size="13" fill="#52625f">Strong task solvers, but each owns</text>
    <text x="239" y="500" text-anchor="middle" font-size="13" fill="#52625f">its parser, renderer, and evaluator.</text>

    <rect x="456" y="170" width="688" height="388" rx="20" fill="#f7faf8" stroke="#90a39f" stroke-width="2"/>
    <text x="800" y="212" text-anchor="middle" font-size="22" font-weight="700" fill="#14302b">Horizontal Harness</text>
    <text x="800" y="240" text-anchor="middle" font-size="14" fill="#52625f">Shared primitives, shared artifact kernel, artifact-specific contracts.</text>

    <rect x="508" y="286" width="150" height="78" rx="14" fill="#e8f5f1" stroke="#168064" stroke-width="2"/>
    <text x="583" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#0b4c40">Source</text>
    <text x="583" y="344" text-anchor="middle" font-size="12" fill="#31524b">packs + assets</text>

    <rect x="700" y="286" width="200" height="78" rx="14" fill="#fff5e8" stroke="#c8712c" stroke-width="2"/>
    <text x="800" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#7b3f13">Artifact Kernel</text>
    <text x="800" y="344" text-anchor="middle" font-size="12" fill="#6d543f">frames, blocks, layers</text>

    <rect x="942" y="286" width="150" height="78" rx="14" fill="#edf2ff" stroke="#5278d6" stroke-width="2"/>
    <text x="1017" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#213f8b">Verifier</text>
    <text x="1017" y="344" text-anchor="middle" font-size="12" fill="#405078">rendered checks</text>

    <rect x="508" y="414" width="150" height="78" rx="14" fill="#f1edf8" stroke="#8467b8" stroke-width="2"/>
    <text x="583" y="446" text-anchor="middle" font-size="15" font-weight="700" fill="#513c7e">Repair</text>
    <text x="583" y="472" text-anchor="middle" font-size="12" fill="#5f536f">stage-aware route</text>

    <rect x="700" y="414" width="200" height="78" rx="14" fill="#f8fbfa" stroke="#90a39f" stroke-width="2"/>
    <text x="800" y="446" text-anchor="middle" font-size="15" font-weight="700" fill="#354f4a">Session Memory</text>
    <text x="800" y="472" text-anchor="middle" font-size="12" fill="#52625f">events + regressions</text>

    <rect x="942" y="414" width="150" height="78" rx="14" fill="#fff5e8" stroke="#c8712c" stroke-width="2"/>
    <text x="1017" y="446" text-anchor="middle" font-size="15" font-weight="700" fill="#7b3f13">Export</text>
    <text x="1017" y="472" text-anchor="middle" font-size="12" fill="#6d543f">poster, deck, web</text>
  </g>
</svg>
