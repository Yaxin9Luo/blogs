<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Managed agentic artifact stack</title>
  <desc id="desc">A sanitized system stack diagram for managed long-horizon artifact generation, separating brain, hands, sandbox, state, evaluators, and human checkpoints.</desc>
  <rect width="1200" height="680" fill="#f8fbfa"/>
  <rect x="54" y="44" width="1092" height="592" rx="22" fill="#ffffff" stroke="#cbd8d5" stroke-width="2"/>
  <text x="88" y="98" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#14302b">Managed Artifact-Generating Agents</text>
  <text x="88" y="132" font-family="Inter, Arial, sans-serif" font-size="16" fill="#536460">Long-running work needs a stable interface between model reasoning, tool execution, durable state, and verification.</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#354f4a"/>
    </marker>
  </defs>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="92" y="182" width="270" height="116" rx="16" fill="#edf2ff" stroke="#5278d6" stroke-width="2"/>
    <text x="227" y="222" text-anchor="middle" font-size="19" font-weight="700" fill="#213f8b">Brains</text>
    <text x="227" y="252" text-anchor="middle" font-size="13" fill="#405078">planner, generator, evaluator</text>

    <rect x="92" y="384" width="270" height="116" rx="16" fill="#fff5e8" stroke="#c8712c" stroke-width="2"/>
    <text x="227" y="424" text-anchor="middle" font-size="19" font-weight="700" fill="#7b3f13">Hands</text>
    <text x="227" y="454" text-anchor="middle" font-size="13" fill="#6d543f">browser, files, renderer, tests</text>

    <rect x="464" y="174" width="272" height="334" rx="18" fill="#f7faf8" stroke="#cbd8d5" stroke-width="2"/>
    <text x="600" y="216" text-anchor="middle" font-size="20" font-weight="700" fill="#14302b">Harness Interface</text>
    <rect x="500" y="252" width="200" height="34" rx="10" fill="#ffffff" stroke="#cbd8d5"/>
    <text x="600" y="274" text-anchor="middle" font-size="13" fill="#52625f">session state</text>
    <rect x="500" y="304" width="200" height="34" rx="10" fill="#ffffff" stroke="#cbd8d5"/>
    <text x="600" y="326" text-anchor="middle" font-size="13" fill="#52625f">sandbox actions</text>
    <rect x="500" y="356" width="200" height="34" rx="10" fill="#ffffff" stroke="#cbd8d5"/>
    <text x="600" y="378" text-anchor="middle" font-size="13" fill="#52625f">artifact contracts</text>
    <rect x="500" y="408" width="200" height="34" rx="10" fill="#ffffff" stroke="#cbd8d5"/>
    <text x="600" y="430" text-anchor="middle" font-size="13" fill="#52625f">handoff logs</text>

    <rect x="838" y="170" width="260" height="132" rx="16" fill="#e8f5f1" stroke="#168064" stroke-width="2"/>
    <text x="968" y="210" text-anchor="middle" font-size="19" font-weight="700" fill="#0b4c40">Durable Artifacts</text>
    <text x="968" y="240" text-anchor="middle" font-size="13" fill="#31524b">source packs, DOM, previews</text>
    <text x="968" y="264" text-anchor="middle" font-size="13" fill="#31524b">commits, reports, traces</text>

    <rect x="838" y="382" width="260" height="132" rx="16" fill="#f1edf8" stroke="#8467b8" stroke-width="2"/>
    <text x="968" y="422" text-anchor="middle" font-size="19" font-weight="700" fill="#513c7e">Governance</text>
    <text x="968" y="452" text-anchor="middle" font-size="13" fill="#5f536f">thresholds, checkpoints</text>
    <text x="968" y="476" text-anchor="middle" font-size="13" fill="#5f536f">human preference, safety</text>

    <path d="M362 240 H464" stroke="#354f4a" stroke-width="3" marker-end="url(#arrow2)"/>
    <path d="M362 442 H464" stroke="#354f4a" stroke-width="3" marker-end="url(#arrow2)"/>
    <path d="M736 286 H838" stroke="#354f4a" stroke-width="3" marker-end="url(#arrow2)"/>
    <path d="M736 426 H838" stroke="#354f4a" stroke-width="3" marker-end="url(#arrow2)"/>
    <path d="M600 508 C600 572 968 572 968 514" fill="none" stroke="#354f4a" stroke-width="3" marker-end="url(#arrow2)"/>
  </g>
</svg>
